<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilloChat - Admin Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
                        display: ['ui-sans-serif', 'system-ui', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', '"Liberation Mono"', '"Courier New"', 'monospace'],
                    },
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        },
                        brand: {
                            primary: '#22C35D',      // verde MilloChat
                            primaryDark: '#1A9B4A',
                            glow: 'rgba(34, 195, 93, 0.4)'
                        },
                        danger: '#E4593F'            // erro — nunca a marca
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #030712;
            background-image: radial-gradient(circle at top right, rgba(34, 195, 93, 0.13), transparent 40%),
                radial-gradient(circle at bottom left, rgba(17, 24, 39, 1), transparent 40%);
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(34, 195, 93, 0.1);
        }

        .glow-input:focus {
            box-shadow: 0 0 0 2px rgba(34, 195, 93, 0.5), 0 0 20px rgba(34, 195, 93, 0.2);
            border-color: #22C35D;
        }

        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(34, 195, 93, 0.5);
            /* sem text-shadow branco: o texto do botão agora é escuro (contraste) */
        }
    </style>
</head>

<body
    class="flex items-center justify-center min-h-screen text-gray-300 antialiased selection:bg-brand-primary selection:text-white">

    <div
        class="glass-panel p-10 rounded-2xl w-[420px] relative overflow-hidden transition-all duration-500 hover:border-brand-primary/30">
        <!-- Decorative subtle accent -->
        <div
            class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-brand-primary to-transparent opacity-70">
        </div>

        <div class="mb-10 text-center">
            <img src="/static/millochat-logo.svg" alt="MilloChat" width="56" height="56"
                class="mx-auto mb-4 drop-shadow-[0_8px_20px_rgba(34,195,93,0.35)]">
            <h1 class="font-display text-4xl font-extrabold tracking-tight text-white mb-2 uppercase">Millo<span
                    class="text-brand-primary">Chat</span></h1>
            <p class="text-gray-400 text-sm tracking-widest uppercase opacity-80 font-semibold">Central Admin Gateway
            </p>
        </div>

        <form action="/admin/login" method="POST" class="space-y-6">
            {% if error %}
            <div
                class="bg-danger/10 border border-danger/50 text-danger px-4 py-3 rounded-lg flex items-start gap-3 text-sm animate-[pulse_2s_ease-in-out_infinite]">
                <svg class="h-5 w-5 text-danger shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span class="block leading-tight mt-0.5">{{ error }}</span>
            </div>
            {% endif %}

            <div class="group">
                <label for="password"
                    class="block text-gray-400 text-xs font-bold mb-2 uppercase tracking-wider group-focus-within:text-brand-primary transition-colors">Credential
                    Key</label>
                <input type="password" id="password" name="password"
                    class="glow-input bg-gray-900 border border-gray-700 text-white rounded-lg w-full py-3 px-4 leading-tight focus:outline-none transition-all duration-300 placeholder-gray-600 font-mono tracking-widest"
                    placeholder="••••••••" required>
            </div>

            <button type="submit"
                title="Entrar no painel"
                class="btn-glow w-full bg-brand-primary hover:bg-brand-primaryDark text-[#0F1A13] font-bold py-3 px-4 rounded-lg focus:outline-none transition-all duration-300 flex justify-center items-center gap-2 mt-4 uppercase tracking-widest text-sm">
                <span>Authorize</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3">
                    </path>
                </svg>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-gray-800 pt-6">
            <p class="text-xs text-gray-500 font-mono">&copy; 2026 Eiai Solutions. Restricted Access.</p>
        </div>
    </div>

</body>

</html>
